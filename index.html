    <!-- Fonts: preconnect first, then a single swap-ed request for two families. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!--
      Loaded asynchronously: the stylesheet is fetched as a non-blocking
      resource and promoted to a real stylesheet once it arrives, so first
      paint never waits on it. display=swap renders fallback text meanwhile.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      onload="this.rel='stylesheet'"
    />

    <!--
      Apply the saved theme before first paint so there is no flash of the
      wrong theme. Inlined deliberately: it must run before the bundle.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = saved ? saved === 'dark' : prefersDark
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
