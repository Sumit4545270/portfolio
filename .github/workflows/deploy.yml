name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy job needs to publish Pages and mint an OIDC token for it.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish, but only
# keep one queued behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Playwright is a devDependency used only by the local check scripts;
          # without this it would pull ~100 MB of browsers on every deploy.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Verify every icon resolves
        run: npm run check:icons

      - name: Build
        run: npm run build
        env:
          # Pages serves this repo from /portfolio/, not the domain root.
          VITE_BASE: /portfolio/

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
